service: ovh-load-balancer
sort_order: 2
cloud_provider: ovh
cloud_region: GRA11
cloud_platform: ovh_public_cloud
cloud_availability_zone: GRA11
subsystem: traffic_management
language: java
topology:
- - vrack-network-manager
  - /api/v1/vrack/route-to-backend
  - GET
- - gateway-nat
  - /api/v1/gw/outbound-status
  - GET
entry_endpoints:
- - /api/v1/lb/stats
  - GET
- - /api/v1/lb/backends
  - GET
- - /api/v1/lb/health
  - POST
db_operations:
- - SELECT
  - lb_backends
  - SELECT backend_id, host, port, weight, status FROM lb_backends WHERE frontend_id = ? AND enabled = true
- - SELECT
  - lb_frontends
  - SELECT frontend_id, name, protocol, bind_port, default_backend FROM lb_frontends WHERE lb_id = ?
- - INSERT
  - lb_health_events
  - INSERT INTO lb_health_events (backend_id, check_result, response_time_ms, checked_at) VALUES (?, ?, ?, NOW())
emit_fault_logs: true
kpi_emitter: true
constants:
  BACKENDS:
  - ovhnet-be-web
  - ovhnet-be-api
  - ovhnet-be-grpc
  FRONTENDS:
  - ovhnet-fe-https
  - ovhnet-fe-tcp
  - ovhnet-fe-internal
steps:
- sample:
    backend:
      choice: BACKENDS
    requests_per_sec:
      if_active:
        randint:
        - 200
        - 2000
      else:
        randint:
        - 5000
        - 45000
    latency_p50:
      if_active:
        uniform:
        - 80.0
        - 500.0
        round: 1
      else:
        uniform:
        - 4.0
        - 25.0
        round: 1
    latency_p99:
      if_active:
        uniform:
        - 500.0
        - 5000.0
        round: 1
      else:
        uniform:
        - 25.0
        - 200.0
        round: 1
- metric:
    name: lb.requests_per_sec
    value:
      var: requests_per_sec
    unit: req/s
- metric:
    name: lb.latency_p50_ms
    value:
      var: latency_p50
    unit: ms
- metric:
    name: lb.latency_p99_ms
    value:
      var: latency_p99
    unit: ms
- log:
    level: INFO
    message: '[HAProxy] backend={backend} rps={requests_per_sec} p50={latency_p50}ms p99={latency_p99}ms'
    attrs:
      operation: request_stats
      lb.backend:
        var: backend
      lb.requests_per_sec:
        var: requests_per_sec
      lb.latency_p50:
        var: latency_p50
      lb.latency_p99:
        var: latency_p99
- sample:
    healthy_backends:
      if_active:
        randint:
        - 1
        - 3
      else:
        randint:
        - 4
        - 8
    total_backends:
      randint:
      - 6
      - 10
    error_5xx_rate:
      if_active:
        uniform:
        - 2.0
        - 15.0
        round: 2
      else:
        uniform:
        - 0.01
        - 0.5
        round: 2
- metric:
    name: lb.healthy_backends
    value:
      var: healthy_backends
    unit: instances
- metric:
    name: lb.total_backends
    value:
      var: total_backends
    unit: instances
- metric:
    name: lb.5xx_error_rate
    value:
      var: error_5xx_rate
    unit: '%'
- log:
    level: INFO
    message: '[HAProxy] healthy={healthy_backends}/{total_backends} 5xx_rate={error_5xx_rate}% frontend=ovhnet-fe-https'
    attrs:
      operation: backend_health
      lb.healthy_backends:
        var: healthy_backends
      lb.total_backends:
        var: total_backends
      lb.error_5xx_rate:
        var: error_5xx_rate
- sample:
    connections_active:
      randint:
      - 2000
      - 45000
    ssl_connections:
      randint:
      - 1500
      - 40000
- metric:
    name: lb.connections_active
    value:
      var: connections_active
    unit: connections
- metric:
    name: lb.ssl_connections
    value:
      var: ssl_connections
    unit: connections
- log:
    level: INFO
    message: '[HAProxy] connections={connections_active} ssl={ssl_connections} protocol=HTTPS interval=60s'
    attrs:
      operation: connection_stats
      lb.connections_active:
        var: connections_active
      lb.ssl_connections:
        var: ssl_connections
# --- Background noise: WARN + unrelated ERROR ---
- sample:
    noise_frontend:
      choice: FRONTENDS
    noise_backend:
      choice: BACKENDS
    queue_depth:
      randint:
      - 10
      - 500
    retry_count:
      randint:
      - 1
      - 5
    config_check_ms:
      uniform:
      - 2.0
      - 50.0
      round: 1
- log:
    level: WARN
    message: '[HAProxy] backend={noise_backend} queue_depth={queue_depth} threshold=100 frontend={noise_frontend} action=THROTTLE'
    attrs:
      operation: queue_warning
      lb.backend:
        var: noise_backend
      lb.queue_depth:
        var: queue_depth
- log:
    level: INFO
    message: '[HAProxy] config-check: syntax=OK sections=14 backends=3 frontends=3 duration={config_check_ms}ms'
    attrs:
      operation: config_validation
      lb.config_check_ms:
        var: config_check_ms
- log:
    level: INFO
    message: '[HAProxy] stick-table: entries=2847 purged=142 frontend={noise_frontend} ttl=1800s'
    attrs:
      operation: stick_table_maintenance
      lb.frontend:
        var: noise_frontend
- log:
    level: ERROR
    message: '[HAProxy] connection_retry: backend={noise_backend} server=10.0.1.42:8080 retries={retry_count} error=ECONREFUSED last_check=L7TOUT'
    attrs:
      operation: connection_retry_failure
      lb.backend:
        var: noise_backend
      lb.retry_count:
        var: retry_count
