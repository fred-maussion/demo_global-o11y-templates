trace_attributes:
  base:
    ovh.project_id: {choice: [ovhnet-prod-001, ovhnet-prod-002, ovhnet-staging]}
    ovh.datacenter: {choice: [GRA11, SBG5, BHS5]}
  services:
    vrack-network-manager:
      vrack.service_name: {choice: [pn-ovhnet-prod, pn-ovhnet-staging]}
      vrack.vlan_id: {randint: [100, 4094]}
      vrack.subnet_cidr: {choice: [10.0.1.0/24, 10.0.2.0/24, 10.0.3.0/24]}
      vrack.cross_dc_pair: {choice: [GRA-SBG, GRA-BHS, SBG-BHS]}
      vrack.mtu: {choice: [1500, 9000]}
    ovh-load-balancer:
      lb.haproxy_backend: {choice: [ovhnet-be-web, ovhnet-be-api, ovhnet-be-grpc]}
      lb.frontend_id: {choice: [ovhnet-fe-https, ovhnet-fe-tcp, ovhnet-fe-internal]}
      lb.backend_count: {randint: [3, 12]}
      lb.health_check_interval: {choice: [5, 10, 30]}
      lb.protocol: {choice: [HTTPS, HTTP, TCP]}
    anti-ddos-vac:
      vac.scrubbing_center: {choice: [VAC-GRA, VAC-SBG, VAC-BHS, VAC-RBX]}
      vac.mitigation_profile: {choice: [network, game, cdn]}
      vac.permanent_mitigation: {choice: [true, false]}
      vac.target_ip: {format: "198.51.100.{a}", a: {randint: [1, 254]}}
    gateway-nat:
      gw.snat_pool_id: {choice: [ovhnet-gw-gra, ovhnet-gw-sbg, ovhnet-gw-bhs]}
      gw.external_ip_count: {randint: [1, 8]}
      gw.port_allocation: {choice: [dynamic, static]}
      gw.associated_network: {choice: [pn-ovhnet-prod, pn-ovhnet-staging]}
    ovhcloud-connect:
      connect.circuit_id: {format: "OCC-{n}", n: {randint: [100000, 999999]}}
      connect.bandwidth_gbps: {choice: [1, 1, 10]}
      connect.type: {choice: [dedicated, provider]}
      connect.pop_location: {choice: [TH2-Paris, AM5-Amsterdam, BRU-Brussels]}
    managed-kubernetes:
      mks.cluster_id: {format: "mks-{n}", n: {randint: [10000, 99999]}}
      mks.cluster_version: {choice: [v1.30.2, v1.29.6, v1.28.11]}
      mks.node_pool_name: {choice: [ovhnet-pool-default, ovhnet-pool-compute, ovhnet-pool-memory]}
      mks.node_flavor: {choice: [b3-8, b3-16, b3-32]}
