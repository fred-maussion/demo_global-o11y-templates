agent_config:
  id: ovh-network-analyst
  name: OVHcloud Network Analyst
  assessment_tool_name: network_health_assessment
  system_prompt: 'You are the OVHcloud Network Analyst, an expert AI assistant for OVHcloud network operations. You help
    network engineers investigate incidents, analyze telemetry data, and provide root cause analysis for fault conditions
    across 6 OVHcloud networking services spanning 3 datacenters (GRA, SBG, BHS). You have deep expertise in OVHcloud vRack
    private networking (VLANs, subnets, cross-DC routing), OVHcloud Load Balancer (HAProxy-based L4/L7 balancing, SSL termination,
    health checks), Anti-DDoS VAC scrubbing (automatic mitigation, false positive detection), Gateway NAT (SNAT port allocation,
    outbound connectivity for Public Cloud), OVHcloud Connect (dedicated and provider interconnect, BGP peering, hybrid
    connectivity), and Managed Kubernetes Service (MKS node pool management, pod lifecycle, cluster health). When investigating
    incidents, search for these OVH-specific identifiers in logs: vRack errors (VRACK-VLAN-SEGMENTATION, VRACK-SUBNET-EXHAUSTION,
    VRACK-FLOATINGIP-CONFLICT), Anti-DDoS events (VAC-FALSE-POSITIVE-FILTERING), Gateway faults (GW-SNAT-EXHAUSTION),
    Connect faults (CONNECT-CIRCUIT-DEGRADATION, CONNECT-BGP-FLAP), LB faults (LB-BACKEND-DRAIN-STORM, LB-SSL-CERT-RENEWAL,
    LB-HEALTHCHECK-FLAP), and MKS events (MKS-NODE-NOTREADY, MKS-POD-OOMKILL). Use the OVH API (GET /cloud/project/{serviceName}/...),
    OpenStack CLI (openstack server list, openstack network list), and ovh-cli for diagnosis. Log messages are in body.text
    — NEVER search the body field alone.'
assessment_tool_config:
  id: network_health_assessment
  description: 'Comprehensive network health assessment. Evaluates all OVHcloud networking services against operational
    readiness criteria. Returns data for health evaluation across vRack, Load Balancer, Anti-DDoS VAC, Gateway NAT, OVHcloud
    Connect, and Managed Kubernetes systems. Log message field: body.text (never use ''body'' alone).'
executive_kpi_emitter_service_name: ovh-load-balancer
executive_dashboard_intro: '**OVHcloud network KPIs** — traffic delivery, network & security, SLO compliance, and cloud
  economics (synthetic `business.*` from `ovh-load-balancer`).'
executive_kpi_sections:
- header: '**Traffic** — requests, latency, backend health, errors, throughput, and connections'
  specs:
  - - LB requests / min
    - metrics.business.lb_requests_per_min
  - - LB latency P50 (ms)
    - metrics.business.lb_latency_p50_ms
  - - Backend health (%)
    - metrics.business.backend_health_pct
  - - 5xx error rate (%)
    - metrics.business.lb_5xx_error_rate_pct
  - - Throughput (Gbps)
    - metrics.business.throughput_gbps
  - - Active connections
    - metrics.business.active_connections
- header: '**Network & security** — vRack latency, DDoS mitigation, Gateway SNAT, Floating IP, packet loss, Connect bandwidth'
  specs:
  - - vRack cross-DC latency (ms)
    - metrics.business.vrack_cross_dc_latency_ms
  - - DDoS mitigation events / min
    - metrics.business.ddos_mitigation_events_per_min
  - - Gateway SNAT utilization (%)
    - metrics.business.gateway_snat_utilization_pct
  - - Floating IP failover count
    - metrics.business.floating_ip_failover_count
  - - Private network packet loss (%)
    - metrics.business.private_network_packet_loss_pct
  - - Connect bandwidth (Gbps)
    - metrics.business.connect_bandwidth_gbps
- header: '**SLO & reliability** — uptime, API success, SLA compliance, MTTD, MTTR'
  specs:
  - - Uptime (%)
    - metrics.business.uptime_pct
  - - API success rate (%)
    - metrics.business.api_success_rate_pct
  - - Network SLA compliance (%)
    - metrics.business.network_sla_compliance_pct
  - - Incident MTTD (min)
    - metrics.business.incident_mttd_min
  - - Incident MTTR (min)
    - metrics.business.incident_mttr_min
  - - Availability index (0–100)
    - metrics.business.availability_index_0_100
- header: '**Commercial** — spend, committed use, cost efficiency, carbon, and SLA breaches'
  specs:
  - - Cloud spend (EUR/min)
    - metrics.business.cloud_spend_eur_per_min
  - - Committed resources utilization (%)
    - metrics.business.committed_resources_utilization_pct
  - - Cost / M requests (EUR)
    - metrics.business.cost_per_million_requests_eur
  - - Resource efficiency (%)
    - metrics.business.resource_efficiency_pct
  - - Carbon intensity (gCO2/TiB)
    - metrics.business.carbon_intensity_gco2_per_tib
  - - Customer SLA breaches
    - metrics.business.customer_sla_breach_count
executive_trend_charts:
- title: LB requests / min
  field: metrics.business.lb_requests_per_min
  y_label: requests/min
- title: LB latency P50 (ms)
